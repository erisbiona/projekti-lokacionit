<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Geolocation Finder</title>
    <!-- Tailwind CSS për dizajn të pastër dhe modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-card rounded-3xl p-8 shadow-2xl text-center relative overflow-hidden">
        
        <!-- Element dekorativ sfondi -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Ikona -->
        <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-purple-500/30 mb-6">
            <i class="fa-solid fa-location-dot text-3xl text-white animate-bounce"></i>
        </div>

        <!-- Titulli & Përshkrimi -->
        <h1 class="text-2xl font-bold tracking-tight mb-3">Zbuloni Vendndodhjen Tuaj</h1>
        <p class="text-slate-300 text-sm leading-relaxed mb-8">
            Lejoni qasjen në vendndodhje për të shfaqur koordinatat tuaja dhe për të aktivizuar shërbimet e bazuara në zonë.
        </p>

        <!-- Butoni i Aktivizimit -->
        <button id="getLocationBtn" onclick="fetchLocation()" class="w-full py-4 px-6 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-semibold rounded-xl shadow-lg shadow-purple-600/30 transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2 mb-4">
            <i class="fa-solid fa-compass"></i>
            <span>Lejo Vendndodhjen</span>
        </button>

        <!-- Zona ku shfaqen të dhënat e lokacionit -->
        <div id="resultContainer" class="hidden mt-6 p-4 rounded-xl bg-black/40 border border-white/10 text-left text-sm space-y-2">
            <p class="text-purple-400 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-circle-check"></i> Lokacioni u sigurua me sukses:
            </p>
            <div id="locationData" class="text-slate-300 font-mono text-xs space-y-1">
                <!-- Këtu shfaqen latitude/longitude -->
            </div>
        </div>

        <!-- Statusi ose Mesazhet e Gabimit -->
        <p id="statusMsg" class="text-xs text-slate-400 mt-4"></p>
    </div>

    <script>
        function fetchLocation() {
            const btn = document.getElementById('getLocationBtn');
            const statusMsg = document.getElementById('statusMsg');
            const resultContainer = document.getElementById('resultContainer');
            const locationData = document.getElementById('locationData');

            if (!navigator.geolocation) {
                statusMsg.textContent = "Shfletuesi juaj nuk e mbështet Geolocation.";
                statusMsg.classList.add('text-red-400');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Duke u lidhur...`;
            statusMsg.textContent = "Ju lutem pranoni kërkesën për vendndodhje në shfletues.";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // Shfaq të dhënat në kuti
                    resultContainer.classList.remove('hidden');
                    locationData.innerHTML = `
                        <div><strong>Gjerësia (Lat):</strong> ${lat}</div>
                        <div><strong>Gjatësia (Lon):</strong> ${lon}</div>
                        <div><strong>Saktësia:</strong> rreth ${Math.round(accuracy)} metra</div>
                    `;

                    statusMsg.textContent = "Vendndodhja u mor me sukses!";
                    statusMsg.className = "text-xs text-emerald-400 mt-4";
                    
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Sukses`;
                    btn.classList.from = "from-purple-600";
                    btn.classList.to = "to-pink-600";

                    // Opsionale: Nëse dëshiron t'i dërgosh te ndonjë webhook (si Webhook.site)
                    // sendToWebhook({ lat, lon, accuracy });
                },
                (error) => {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-compass"></i> Progo Përsëri`;
                    statusMsg.textContent = "Gabim: " + error.message;
                    statusMsg.className = "text-xs text-red-400 mt-4";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Funksioni opsional për Webhook (nëse ju duhet për provë/detyrë)
        /*
        function sendToWebhook(data) {
            fetch('https://webhook.site/KODI-JUAJ-KETU', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.log(err));
        }
        */
    </script>
</body>
</html>
